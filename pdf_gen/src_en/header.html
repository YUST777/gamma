<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>ICPC HUE Community Report — Season 2025/2026</title>
  <style>
    @page { size: A4 portrait; margin: 0; }

    :root {
      --accent: #E19D1B;
      --accent-dark: #A8720F;
      --card: #FBF3E3;
      --border: #E8DCC4;
      --head: #141414;
      --body: #383838;
      --muted: #7A7A7A;
      --line: #ECECEC;
      --font-head: 'Lato', 'Noto Sans', sans-serif;
      --font-body: 'Noto Sans', 'Lato', sans-serif;
    }

    * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    body {
      margin: 0; padding: 0;
      font-family: var(--font-body);
      color: var(--body);
      font-size: 11px;
      line-height: 1.8;
      background: #F0EDE6;
    }
    @media print { body { background: transparent; } }

    .page {
      width: 210mm; height: 297mm;
      background: #fff;
      padding: 13mm 15mm 11mm 15mm;
      position: relative;
      page-break-after: always;
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .page:last-child { page-break-after: auto; }
    
    /* latin fragments (urls, names of contests) keep LTR order */
    .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }

    /* header / footer */
    .top {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 14px;
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand img { height: 28px; }
    .brand-txt { font-family: var(--font-head); font-size: 9px; font-weight: 700; color: var(--head); line-height: 1.4; }
    .brand-txt span { color: var(--accent-dark); font-weight: 600; }
    .pill {
      background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      padding: 2px 10px; font-size: 8.5px; font-weight: 700; color: var(--accent-dark);
      font-family: var(--font-head);
    }
    .foot {
      margin-top: auto; padding-top: 6px; border-top: 1px solid var(--line);
      display: flex; justify-content: space-between; font-size: 8px; color: var(--muted);
    }

    /* titles */
    .kicker {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--font-head); font-size: 9.5px; font-weight: 700; color: var(--accent-dark);
    }
    .kicker::before { content: ""; width: 20px; height: 3px; background: var(--accent); border-radius: 2px; }
    h1 {
      font-family: var(--font-head); font-size: 23px; font-weight: 800; color: var(--head);
      margin: 2px 0 4px 0; line-height: 1.5;
    }
    h2 {
      font-family: var(--font-head); font-size: 13px; font-weight: 700; color: var(--head);
      margin: 0 0 4px 0; line-height: 1.5;
    }
    .lead { font-size: 11px; color: #4A4A4A; margin: 0 0 12px 0; }
    p { margin: 0 0 6px 0; }

    /* cards & grids */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px; }
    .card-w { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px; }
    .card-dark { background: #1A1A1A; color: #EEE; border-radius: 12px; padding: 12px 15px; }
    .card-dark h2 { color: var(--accent); }
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
    .g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-bottom: 10px; }

    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 9px 11px; }
    .stat b {
      display: block; font-family: var(--font-head); font-size: 21px; font-weight: 800;
      color: var(--head); line-height: 1.3; direction: ltr; text-align: right;
    }
    .stat span { font-size: 9px; color: var(--accent-dark); font-weight: 700; display: block; line-height: 1.5; }
    .stat small { font-size: 8.5px; color: var(--muted); display: block; line-height: 1.5; }

    ul.clean { margin: 0; padding: 0 16px 0 0; }
    ul.clean li { margin-bottom: 3px; }
    ul.clean li::marker { color: var(--accent); }

    /* path / flow */
    .flow { display: flex; align-items: stretch; gap: 6px; margin: 4px 0 10px 0; }
    .flow .st {
      flex: 1; text-align: center; background: #fff; border: 1px solid var(--border); border-radius: 10px;
      padding: 6px 4px; font-size: 8.5px; color: var(--muted); line-height: 1.5;
    }
    .flow .st b { display: block; font-family: var(--font-head); font-size: 12px; color: var(--head); }
    .flow .st.on { background: var(--accent); border-color: var(--accent-dark); color: #222; }
    .flow .arr { align-self: center; color: var(--accent-dark); font-size: 13px; font-weight: 800; }

    /* timeline */
    .tl { position: relative; margin: 0; padding: 0; list-style: none; }
    .tl::before { content: ""; position: absolute; right: 74px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
    .tl li { display: flex; gap: 14px; margin-bottom: 7px; position: relative; }
    .tl .d {
      width: 66px; flex-shrink: 0; font-family: var(--font-head); font-size: 8.8px; font-weight: 700;
      color: var(--accent-dark); line-height: 1.5; padding-top: 1px;
    }
    .tl li::after {
      content: ""; position: absolute; right: 70px; top: 5px; width: 10px; height: 10px;
      border-radius: 50%; background: #fff; border: 2px solid var(--accent);
    }
    .tl li.hl::after { background: var(--accent); }
    .tl .c { flex: 1; padding-right: 8px; font-size: 9.8px; line-height: 1.65; }
    .tl .c b { font-family: var(--font-head); color: var(--head); font-size: 10.3px; }

    /* photos */
    .ph { border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: #F4EADA; }
    .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cap { font-size: 8.3px; color: var(--muted); margin-top: 2px; line-height: 1.5; }

    /* table */
    table.t { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; font-size: 9.3px; }
    table.t th { background: var(--card); color: var(--head); font-family: var(--font-head); font-weight: 700; text-align: right; padding: 5px 9px; border-bottom: 1px solid var(--border); }
    table.t td { padding: 4.5px 9px; border-bottom: 1px solid #F0E8DA; vertical-align: top; line-height: 1.6; }
    table.t tr:last-child td { border-bottom: none; }
    table.t tr:nth-child(even) td { background: #FDFAF5; }
    table.t td.n { white-space: nowrap; font-weight: 600; color: var(--accent-dark); }

    /* requests */
    .req { display: flex; gap: 9px; align-items: flex-start; background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 7px 10px; }
    .req .i {
      width: 22px; height: 22px; flex-shrink: 0; border-radius: 6px; background: var(--accent);
      color: #111; font-family: var(--font-head); font-weight: 800; font-size: 11px;
      display: flex; align-items: center; justify-content: center;
    }
    .req b { font-family: var(--font-head); color: var(--head); font-size: 10.2px; display: block; line-height: 1.5; }
    .req div { font-size: 9.3px; line-height: 1.6; }

    .note { font-size: 8.3px; color: var(--muted); line-height: 1.6; }
    .code {
      direction: ltr; text-align: left; font-family: 'DejaVu Sans Mono', monospace; font-size: 8.8px;
      background: #1A1A1A; color: #F2D9A6; border-radius: 8px; padding: 7px 10px; line-height: 1.55; margin-top: 6px;
    }
    .s { font-size: 10.3px; line-height: 1.8; }
    .ct { font-family: var(--font-head); color: var(--head); font-size: 11px; font-weight: 700; display: block; line-height: 1.6; margin-bottom: 2px; }
    .sec { margin: 4px 0 6px 0; }
    .num { font-family: var(--font-head); font-weight: 800; color: var(--accent-dark); }
    .zf > :not(.top):not(.foot) { zoom: 1.16; }
    .zg > :not(.top):not(.foot) { zoom: 1.1; }
    .ledger .sheet-table td { padding: 4.6px 5px; }
    .zj > :not(.top):not(.foot) { zoom: 1.42; }
    .tl.loose li { margin-bottom: 13px; }
    .sess table.t td { padding: 6.2px 9px; }
    .zh > :not(.top):not(.foot) { zoom: 1.32; }
    .zi > :not(.top):not(.foot) { zoom: 1.24; }
    .shot { border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
    .shot img { width: 100%; display: block; }
    /* spreadsheet ledger (copied from the 2025-2027 report, RTL) */
    .sheet-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .sheet-title-bar { background: #FAF6EE; color: var(--accent-dark); font-family: var(--font-head); font-weight: 800; font-size: 9px; padding: 4px 8px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .sheet-table { width: 100%; border-collapse: collapse; font-size: 8.6px; line-height: 1.45; }
    .sheet-table th { background: #F5F1E8; color: #7A7062; font-weight: 700; font-size: 8px; padding: 3px 5px; border-bottom: 1px solid #DFD8CC; border-left: 1px solid #DFD8CC; text-align: right; }
    .sheet-table th:last-child { border-left: none; text-align: left; }
    .sheet-table td { padding: 2.6px 5px; border-bottom: 1px solid #ECE7DE; border-left: 1px solid #ECE7DE; color: var(--body); vertical-align: middle; }
    .sheet-table td:last-child { border-left: none; }
    .sheet-table td.col-idx { font-family: 'DejaVu Sans Mono', monospace; font-size: 7.6px; font-weight: 700; color: #8C8275; background: #F7F4EC; text-align: center; width: 20px; }
    .sheet-table td.col-date { font-size: 8px; color: #6B6255; text-align: left; white-space: nowrap; }
    .sheet-table tr:nth-child(even) td:not(.col-idx) { background: #FAF8F4; }
    .sheet-table tr.row-contest td { background: #FEF7E8 !important; color: #8C5D08 !important; font-weight: 700; }
    .sheet-table tr.row-contest td.col-idx { background: #FDE8B5 !important; color: #784E04 !important; }
    .sheet-table tr.row-break td { background: #F3F0EA !important; color: #8A8175 !important; font-style: italic; }
    .tag-accent { display: inline-block; background: var(--accent); color: #000; font-weight: 700; font-size: 8.5px; padding: 1px 6px; border-radius: 4px; margin-right: 4px; }
    .pl { font-family: var(--font-head); font-weight: 700; color: var(--accent-dark); }
    .ok { font-family: var(--font-head); font-weight: 700; color: #2E7D4F; }
    /* ---- LTR overrides for the English edition ---- */
    body { line-height: 1.6; }
    .s { line-height: 1.6; }
    .stat b { text-align: left; }
    ul.clean { padding: 0 0 0 16px; }
    .tl::before { right: auto; left: 74px; }
    .tl li::after { right: auto; left: 70px; }
    .tl .c { padding-right: 0; padding-left: 8px; }
    table.t th { text-align: left; }
    .sheet-table th { text-align: left; border-left: none; border-right: 1px solid #DFD8CC; }
    .sheet-table th:last-child { border-right: none; text-align: right; }
    .sheet-table td { border-left: none; border-right: 1px solid #ECE7DE; }
    .sheet-table td:last-child { border-right: none; }
    .sheet-table td.col-date { text-align: right; }
    .tag-accent { margin-right: 0; margin-left: 4px; }
    h1 { letter-spacing: -0.01em; line-height: 1.25; }
  </style>
</head>
<body>
